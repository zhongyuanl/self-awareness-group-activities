function settle(){const error=validateSale(lot,leader,bid);if(error){toast(error);return}if(!confirm(`确认“${D.lots[lot]}”由第${leader+1}组以${bid}万元成交？成交后余额${A.balances[leader]-bid}万元。`))return;snap();A.balances[leader]-=bid;A.records.push({lot,group:leader,price:bid});bid=0;leader=null;save();renderAuction()}
function downloadAuction(content,name,type){const u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportAuction(){const rows=[['价值观大拍卖','金额单位：万元'],[],['拍品','成交小组','成交价'],...D.lots.map((name,i)=>{const r=A.records.find(x=>x.lot===i);return [name,r?r.group===null?'流拍':'第'+(r.group+1)+'组':'待拍',r?r.price:'']}),[],['小组','拍得的项目','总花费','剩余额度'],...groupSummary().map(g=>['第'+(g.group+1)+'组',g.lots.join('、')||'暂无',g.spent,g.balance])];const csv='\uFEFF'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');downloadAuction(csv,'价值观拍卖汇总.csv','text/csv;charset=utf-8')}
function validateBackup(x){if(x?.format!=='teacher-value-auction'||x.version!==1||JSON.stringify(x.lots)!==JSON.stringify(D.lots)||!Array.isArray(x.records)||x.records.length>D.lots.length||!Array.isArray(x.balances)||x.balances.length!==15)throw Error();const balances=Array(15).fill(1000),seen=new Set();for(const r of x.records){if(!Number.isInteger(r.lot)||r.lot<0||r.lot>=D.lots.length||seen.has(r.lot))throw Error();seen.add(r.lot);if(r.group===null){if(r.price!==0)throw Error()}else{if(!Number.isInteger(r.group)||r.group<0||r.group>=15||!Number.isInteger(r.price)||r.price<100||r.price%100!==0||r.price>balances[r.group])throw Error();balances[r.group]-=r.price}}if(JSON.stringify(balances)!==JSON.stringify(x.balances))throw Error();return {balances,records:x.records.map(r=>({lot:r.lot,group:r.group,price:r.price})),undo:[]}}
async function restoreAuction(e){const file=e.target.files?.[0];if(!file)return;try{if(file.size>100000)throw Error();const restored=validateBackup(JSON.parse(await file.text()));if(confirm('用备份替换当前拍卖记录？当前记录可先导出备份。')){A=restored;let replay={balances:Array(15).fill(1000),records:[]};for(const r of A.records){A.undo.push({balances:[...replay.balances],records:replay.records.map(x=>({...x}))});if(r.group!==null)replay.balances[r.group]-=r.price;replay.records.push({...r})}lot=0;bid=0;leader=null;save();renderAuction();toast('已恢复拍卖记录')}}catch(err){toast('备份格式或预算不正确，当前记录未修改')}e.target.value=''}

render();
if(query.get('auction')==='1'&&mode==='teacher'){renderAuction();$('auction').showModal()}
</script></body></html>
